<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VidyaSetu | Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>VidyaSetu</h1>
  <p class="tagline" id="welcome"></p>

  <button class="logout" onclick="logout()">Logout</button>

  <div class="id-card">
    <h3>Student ID</h3>
    <p><b>Name:</b> <span id="name"></span></p>
  </div>

  <div class="task-box">
    <input id="taskInput" placeholder="Add task">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
