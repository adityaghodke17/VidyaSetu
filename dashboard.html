<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
  <div class="loader-card">
    <div class="spinner"></div>
    <h3>Preparing Dashboard</h3>
  </div>
</div>

<div class="dashboard">

  <header class="top-bar">
    <h2 id="welcomeText">Welcome</h2>
    <div>
      <button id="themeToggle">🌙</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="main-grid">

    <!-- LEFT ID CARD -->
    <div class="id-card tooltip" data-tip="Your digital student ID">
      <img id="card-photo">
      <h3 id="card-name"></h3>
      <p id="card-enroll"></p>
      <p id="card-email"></p>
      <p id="card-phone"></p>
    </div>

    <!-- RIGHT SUBJECT MANAGER -->
    <div class="subject-box glass-card">
      <h3>Subject Manager</h3>

      <input id="sub-name" placeholder="Subject Name">
      <input type="date" id="sub-start">
      <input type="date" id="sub-due">
      <input id="sub-teacher" placeholder="Teacher Name">

      <button class="primary-btn" onclick="addSubject()">Add Subject</button>

      <ul id="subjectList"></ul>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
