<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="dashboard">
  <div class="dashboard-header">
    <h2 id="student-name">Welcome, Student</h2>
    <button id="logout-btn">Logout</button>
  </div>

  <div id="id-card">
    <div class="ribbon">Premium</div>
    <div id="profile-photo-container">
      <img id="profile-photo" src="default-avatar.png" alt="Profile Photo" title="Click to upload your photo">
      <input type="file" id="photo-upload" accept="image/*">
    </div>
    <h3 id="card-name"></h3>
    <p>Enrollment: <span id="card-enrollment"></span></p>
    <p>Email: <span id="card-email"></span></p>
    <p>Phone: <span id="card-phone"></span></p>
  </div>

  <div id="subject-section">
    <h3>Add Subject</h3>
    <input type="text" id="subject-name" placeholder="Subject Name">
    <input type="date" id="subject-start">
    <input type="date" id="subject-due">
    <input type="text" id="subject-teacher" placeholder="Teacher Name">
    <button id="add-subject-btn">Add Subject</button>
    <ul id="subjects-list"></ul>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('add-subject-btn').addEventListener('click', addSubject);
  document.getElementById('photo-upload').addEventListener('change', uploadPhoto);
  window.onload = loadDashboard;
</script>
</body>
</html>
