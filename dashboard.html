<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | VidhyaSetu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dash-body">

<header class="dash-top">
  <h2 id="welcome"></h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="dash-main">

  <!-- Flipping ID Card -->
  <div class="id-card-container">
    <div class="id-card-flip">
      <div class="id-card front">
        <img id="cardPhoto">
        <h3 id="cardName"></h3>
        <p id="cardEnroll"></p>
      </div>
      <div class="id-card back">
        <p id="cardEmail"></p>
        <p id="cardPhone"></p>
        <p>VidhyaSetu Premium Student</p>
      </div>
    </div>
  </div>

  <!-- Subjects Section -->
  <div class="subjects">
    <h3>Subjects</h3>
    <input id="subName" placeholder="Subject Name">
    <input id="subTeacher" placeholder="Teacher Name">
    <button onclick="addSubject()">Add</button>
    <ul id="subjectList"></ul>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
