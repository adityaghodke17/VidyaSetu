<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VidyaSetu | Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">

  <!-- CARTOON CREW -->
  <div class="cartoon-box">
    <div class="face yellow"><div class="eye left"></div><div class="eye right"></div></div>
    <div class="face purple"><div class="eye left"></div><div class="eye right"></div></div>
    <div class="face orange"><div class="eye left"></div><div class="eye right"></div></div>
    <div class="face black"><div class="eye left"></div><div class="eye right"></div></div>
  </div>

  <!-- LOGIN -->
  <div class="login-container">
    <h2>VidyaSetu</h2>
    <p class="login-sub">Login but make it fun 👀</p>

    <input id="studentName" placeholder="Username">
    <input id="password" type="password" placeholder="Password (min 6 chars)">

    <button onclick="login()">Enter</button>
    <p id="msg"></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
