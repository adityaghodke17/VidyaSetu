<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-section">
  <div id="login-box">
    <h2>Student Login</h2>
    <input type="text" id="name" placeholder="Enter Name" required>
    <input type="text" id="enrollment" placeholder="Enrollment No." required>
    <input type="email" id="email" placeholder="Enter Gmail only" required>
    <input type="tel" id="phone" placeholder="10-digit Indian Phone" required>

    <!-- Photo upload -->
    <div id="photo-container">
      <img id="profile-photo-preview" src="default-avatar.png" alt="Profile Photo" title="Click to upload photo">
      <input type="file" id="photo-upload" accept="image/*">
    </div>

    <button id="login-btn">Login</button>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.getElementById('login-btn').addEventListener('click', login);

  // Photo preview
  document.getElementById('photo-upload').addEventListener('change', function(event){
    const reader = new FileReader();
    reader.onload = function() {
      const dataURL = reader.result;
      document.getElementById('profile-photo-preview').src = dataURL;
      localStorage.setItem('profilePhoto', dataURL);
    };
    reader.readAsDataURL(event.target.files[0]);
  });
</script>
</body>
</html>
