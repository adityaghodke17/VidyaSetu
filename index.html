<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VidyaSetu – Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>VidyaSetu</h1>
        <p class="tagline">Because assignments don’t remember themselves 😄</p>

        <div class="task-box">
            <input type="text" id="taskInput" placeholder="Enter your task">
            <input type="date" id="dateInput">
            <button onclick="addTask()">Add Task</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
