<!-- LOGIN SCREEN -->
<div class="login-container" id="loginBox">
    <h2>VidyaSetu</h2>
    <p class="login-sub">Smart Student Login</p>

    <input type="text" id="studentName" placeholder="Full Name">

    <input type="text" id="studentEmail" placeholder="Email (example@gmail.com)">

    <div class="phone-box">
        <select id="countryCode">
            <option value="+91">🇮🇳 +91</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
        </select>
        <input type="text" id="studentPhone" placeholder="Phone number">
    </div>

    <button onclick="sendOTP()">Send OTP</button>

    <!-- OTP BOX -->
    <div class="otp-box hidden" id="otpBox">
        <input type="text" id="otpInput" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify & Login</button>
        <p class="otp-msg">OTP sent to your email 📩</p>
    </div>
</div>
