<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script>
  if (localStorage.getItem("loggedIn") === "true") {
    window.location.href = "dashboard.html";
  }
</script>
</head>
<body>

<div id="loader">
  <div class="loader-card">
    <div class="spinner"></div>
    <h3>Loading Student Portal</h3>
    <p>Please wait...</p>
  </div>
</div>

<div class="login-wrapper">
  <div class="glass-card">
    <h2>Student Login</h2>

    <input id="name" placeholder="Full Name">
    <input id="enrollment" placeholder="Enrollment Number">
    <input id="email" placeholder="Gmail only">
    <input id="phone" placeholder="10-digit Indian phone">

    <div class="photo-box tooltip" data-tip="Upload profile photo">
      <img id="photo-preview" src="default-avatar.png">
      <input type="file" id="photo-input" hidden>
      <button onclick="triggerPhoto()">Upload Photo</button>
    </div>

    <button class="primary-btn" onclick="login()">Login</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
