<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Student Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SECTION -->
<div id="login-section">
  <div id="login-box">
    <h2>Student Login</h2>
    <input type="text" id="name" placeholder="Enter Name" required>
    <input type="text" id="enrollment" placeholder="Enrollment No." required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="phone" placeholder="Phone" required>
    <button id="login-btn">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dashboard-header">
    <h2 id="student-name">Welcome, Student</h2>
    <button id="logout-btn">Logout</button>
  </div>

  <!-- ID CARD -->
  <div id="id-card">
    <div id="profile-photo-container">
      <img id="profile-photo" src="default-avatar.png" alt="Profile Photo">
      <input type="file" id="photo-upload" accept="image/*">
    </div>
    <h3 id="card-name"></h3>
    <p>Enrollment: <span id="card-enrollment"></span></p>
    <p>Email: <span id="card-email"></span></p>
    <p>Phone: <span id="card-phone"></span></p>
  </div>

  <!-- SUBJECT SELECTION -->
  <div id="subject-section">
    <h3>Select Subjects</h3>
    <select id="subject-select">
      <option value="Mathematics">Mathematics</option>
      <option value="Physics">Physics</option>
      <option value="Chemistry">Chemistry</option>
      <option value="Biology">Biology</option>
      <option value="Computer Science">Computer Science</option>
      <option value="English">English</option>
    </select>
    <button id="add-subject-btn">Add Subject</button>

    <ul id="subjects-list"></ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
