<!DOCTYPE html>
<html>
<head>
  <title>Student Portal | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.href = "dashboard.html";
    }
  </script>
</head>
<body>

<div id="loader">Loading...</div>

<div class="login-box">
  <h2>Student Login</h2>

  <input id="name" placeholder="Full Name">
  <input id="enroll" placeholder="Enrollment No">
  <input id="email" placeholder="Gmail only">
  <input id="phone" placeholder="10-digit Indian phone">

  <div class="photo-box">
    <img id="photoPreview" src="https://via.placeholder.com/120">
    <input type="file" id="photoInput" hidden>
    <button onclick="uploadPhoto()">Upload Photo</button>
  </div>

  <button onclick="login()">Login</button>
</div>

<script src="script.js"></script>
</body>
</html>
